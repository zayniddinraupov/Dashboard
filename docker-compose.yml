name: hr-dashboard
services:
  hr-dashboard:
    build: .
    container_name: hr-dashboard
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./database.db:/app/database.db
      - ./2fa_admin.secret:/app/2fa_admin.secret
      - ./2fa_supervisor.secret:/app/2fa_supervisor.secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/auth/csrf"]
      interval: 30s
      timeout: 10s
      retries: 3
